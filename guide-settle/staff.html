<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Guide settlement link</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="common.css"></head>
<body><div class="ct"><div class="cd"><h2 id="h"></h2>
<div class="fg"><label id="l1"></label><input id="sn" placeholder="田中 花子" autocomplete="name"></div>
<div class="fg"><label id="l2"></label><input id="se" type="email" placeholder="tanaka@kinoko-group.co.jp" autocomplete="email"></div>
<button class="bp full" id="go"></button>
<div id="res" style="display:none;margin-top:18px;padding:14px;background:#f8fcf8;border:1px solid #c8dfc8;border-radius:8px;word-break:break-all"><p class="muted" id="sd" style="margin-bottom:8px"></p><a id="lnk" target="_blank" style="color:var(--c)"></a><div class="acts"><button class="bs" id="cp"></button></div></div>
</div></div>
<script src="common.js"></script><script>
mountBar();
const q=new URLSearchParams(location.search);
$('#sn').value=localStorage.getItem('gs-sn')||'';$('#se').value=localStorage.getItem('gs-se')||'';
window.rerender=()=>{$('#h').textContent=T('sTitle');$('#l1').textContent=T('sName');$('#l2').textContent=T('sMail');$('#go').textContent=T('sGen');$('#sd').textContent=T('sSend');$('#cp').textContent=T('sCopy')};rerender();
$('#go').onclick=()=>{const n=$('#sn').value.trim(),e=$('#se').value.trim();if(!n||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)){toast(T('sNeed'),1);return}
 localStorage.setItem('gs-sn',n);localStorage.setItem('gs-se',e);
 const base=location.origin+location.pathname.replace(/staff\.html$/,'');
 const u=base+'index.html?staff_name='+encodeURIComponent(n)+'&staff_email='+encodeURIComponent(e);
 $('#lnk').href=u;$('#lnk').textContent=u;$('#res').style.display='block'};
$('#cp').onclick=async()=>{try{await navigator.clipboard.writeText($('#lnk').href);toast(T('sCopied'))}catch{const r=document.createRange();r.selectNode($('#lnk'));getSelection().removeAllRanges();getSelection().addRange(r)}};
</script></body></html>
